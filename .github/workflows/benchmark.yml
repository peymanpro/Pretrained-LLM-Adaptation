name: Benchmark
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiment]') }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiment]') }}
env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiment]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "pyyaml>=6,<7" "scikit-learn>=1.7,<2"
      - name: Prepare data and classical baselines
        env: { PYTHONPATH: src }
        run: |
          python scripts/download_data.py --config configs/ci-final.yaml
          python scripts/prepare_data.py --config configs/ci-final.yaml
          python scripts/run_baselines.py --config configs/baseline.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-inputs
          path: |
            data/processed/banking77/
            experiments/baselines.json

  frozen:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiment]')
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m pip install --upgrade \
            "transformers>=5,<6" "peft>=0.20,<1" "protobuf>=5,<7" \
            "datasets>=4,<5" "accelerate>=1.8,<2" "pyyaml>=6,<7" \
            "sentencepiece>=0.2,<1" "scikit-learn>=1.7,<2"
      - uses: actions/download-artifact@v4
        with: { name: benchmark-inputs }
      - name: Train frozen baseline
        env: { PYTHONPATH: src }
        run: python scripts/train_frozen.py --config configs/ci-frozen.yaml
      - name: Evaluate frozen baseline
        env: { PYTHONPATH: src }
        run: |
          python scripts/evaluate_model.py \
            --model-dir artifacts/runs/frozen-deberta \
            --data data/processed/banking77/test.jsonl \
            --output experiments/frozen-evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-evidence
          path: |
            experiments/frozen-evaluation.json
            artifacts/runs/frozen-deberta/run_metadata.json

  lora-ablation:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiment]')
    needs: prepare
    strategy:
      fail-fast: false
      matrix: { rank: [4, 8, 16] }
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m pip install --upgrade \
            "transformers>=5,<6" "peft>=0.20,<1" "protobuf>=5,<7" \
            "datasets>=4,<5" "accelerate>=1.8,<2" "pyyaml>=6,<7" \
            "sentencepiece>=0.2,<1" "scikit-learn>=1.7,<2"
      - uses: actions/download-artifact@v4
        with: { name: benchmark-inputs }
      - name: Train LoRA rank
        env: { PYTHONPATH: src }
        run: python scripts/train_lora.py --config configs/ci-r${{ matrix.rank }}.yaml
      - name: Validate on validation split
        env: { PYTHONPATH: src }
        run: |
          python scripts/evaluate_model.py \
            --model-dir artifacts/runs/ablation-r${{ matrix.rank }} \
            --adapter \
            --data data/processed/banking77/validation.jsonl \
            --output experiments/ablation-r${{ matrix.rank }}-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: rank-${{ matrix.rank }}-evidence
          path: |
            experiments/ablation-r${{ matrix.rank }}-validation.json
            artifacts/runs/ablation-r${{ matrix.rank }}/run_metadata.json

  select-rank:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiment]')
    needs: lora-ablation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rank-*-evidence
          merge-multiple: true
          path: evidence
      - name: Select rank using validation macro F1
        env: { PYTHONPATH: src }
        run: |
          python scripts/select_rank.py \
            --reports \
            evidence/experiments/ablation-r4-validation.json \
            evidence/experiments/ablation-r8-validation.json \
            evidence/experiments/ablation-r16-validation.json \
            --output selected-rank.json
      - uses: actions/upload-artifact@v4
        with:
          name: selected-rank
          path: selected-rank.json

  final:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiment]')
    needs: [prepare, frozen, select-rank]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m pip install --upgrade \
            "transformers>=5,<6" "peft>=0.20,<1" "protobuf>=5,<7" \
            "datasets>=4,<5" "accelerate>=1.8,<2" "pyyaml>=6,<7" \
            "sentencepiece>=0.2,<1" "scikit-learn>=1.7,<2"
      - uses: actions/download-artifact@v4
        with: { name: benchmark-inputs }
      - uses: actions/download-artifact@v4
        with: { name: frozen-evidence, path: frozen-evidence }
      - uses: actions/download-artifact@v4
        with: { name: selected-rank, path: selected-rank }
      - name: Resolve selected rank
        id: rank
        shell: bash
        run: echo "rank=$(python -c 'import json; print(json.load(open("selected-rank/selected-rank.json"))["selected"]["rank"])')" >> "$GITHUB_OUTPUT"
      - run: cp frozen-evidence/experiments/frozen-evaluation.json experiments/frozen-evaluation.json
      - name: Train final LoRA
        env: { PYTHONPATH: src }
        run: |
          python scripts/train_lora.py \
            --config configs/ci-final.yaml \
            --epochs 1 \
            --experiment-name selected-r${{ steps.rank.outputs.rank }}-final
      - name: Evaluate final model on full test
        env: { PYTHONPATH: src }
        run: |
          python scripts/evaluate_model.py \
            --model-dir artifacts/runs/selected-r${{ steps.rank.outputs.rank }}-final \
            --adapter \
            --data data/processed/banking77/test.jsonl \
            --output experiments/selected-r${{ steps.rank.outputs.rank }}-final-evaluation.json
      - name: Analyze errors
        env: { PYTHONPATH: src }
        run: |
          python scripts/analyze_errors.py \
            experiments/selected-r${{ steps.rank.outputs.rank }}-final-evaluation.json \
            --output experiments/selected-r${{ steps.rank.outputs.rank }}-final-error-analysis.json
      - name: Compare predictions
        env: { PYTHONPATH: src }
        run: |
          python scripts/compare_predictions.py \
            experiments/frozen-evaluation.json \
            experiments/selected-r${{ steps.rank.outputs.rank }}-final-evaluation.json \
            --output experiments/frozen-vs-final-changes.json
      - name: Compile results
        env: { PYTHONPATH: src }
        run: python scripts/compile_results.py
      - name: Write benchmark report
        env: { PYTHONPATH: src }
        run: |
          python scripts/write_benchmark_report.py \
            --summary experiments/summary.json \
            --selection selected-rank/selected-rank.json \
            --errors experiments/selected-r${{ steps.rank.outputs.rank }}-final-error-analysis.json \
            --output docs/BENCHMARK-REPORT.md \
            --run-id "$GITHUB_RUN_ID"
      - name: Inference smoke
        env: { PYTHONPATH: src }
        run: |
          python -m pretrained_llm_adaptation.cli predict \
            --model-dir artifacts/runs/selected-r${{ steps.rank.outputs.rank }}-final \
            --text "How long will my card take to arrive?"
      - uses: actions/upload-artifact@v4
        with:
          name: final-benchmark-evidence
          path: |
            experiments/
            docs/BENCHMARK-REPORT.md
            artifacts/runs/*/run_metadata.json

  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiment]')
    needs: final
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: final-benchmark-evidence, path: published }
      - name: Publish verified evidence
        run: |
          cp -r published/experiments/. experiments/
          cp published/docs/BENCHMARK-REPORT.md docs/BENCHMARK-REPORT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments docs/BENCHMARK-REPORT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: publish verified benchmark evidence"
          git push origin HEAD:main
