name: Benchmark
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiment]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "pyyaml>=6,<7" "scikit-learn>=1.7,<2"
      - name: Prepare data and classical baselines
        env: { PYTHONPATH: src }
        run: |
          python scripts/download_data.py --config configs/ci-final.yaml
          python scripts/prepare_data.py --config configs/ci-final.yaml
          python scripts/run_baselines.py --config configs/baseline.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-inputs
          path: |
            data/processed/banking77/
            experiments/baselines.json

  frozen:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiment]')
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m pip install --upgrade             "transformers>=5,<6" "peft>=0.20,<1" "protobuf>=5,<7"             "datasets>=4,<5" "accelerate>=1.8,<2" "pyyaml>=6,<7"             "sentencepiece>=0.2,<1" "scikit-learn>=1.7,<2"
      - uses: actions/download-artifact@v4
        with: { name: benchmark-inputs }
      - name: Train frozen baseline
        env: { PYTHONPATH: src }
        run: python scripts/train_frozen.py --config configs/ci-frozen.yaml
      - name: Evaluate frozen baseline
        env: { PYTHONPATH: src }
        run: |
          python scripts/evaluate_model.py             --model-dir artifacts/runs/frozen-deberta             --data data/processed/banking77/test.jsonl             --output experiments/frozen-evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-evidence
          path: |
            experiments/frozen-evaluation.json
            artifacts/runs/frozen-deberta/run_metadata.json

  lora-ablation:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiment]')
    needs: prepare
    strategy:
      fail-fast: false
      matrix: { rank: [4, 8, 16] }
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m pip install --upgrade             "transformers>=5,<6" "peft>=0.20,<1" "protobuf>=5,<7"             "datasets>=4,<5" "accelerate>=1.8,<2" "pyyaml>=6,<7"             "sentencepiece>=0.2,<1" "scikit-learn>=1.7,<2"
      - uses: actions/download-artifact@v4
        with: { name: benchmark-inputs }
      - name: Train LoRA rank
        env: { PYTHONPATH: src }
        run: python scripts/train_lora.py --config configs/ci-r${{ matrix.rank }}.yaml
      - name: Validate on validation split
        env: { PYTHONPATH: src }
        run: |
          python scripts/evaluate_model.py             --model-dir artifacts/runs/ablation-r${{ matrix.rank }}             --adapter             --data data/processed/banking77/validation.jsonl             --output experiments/ablation-r${{ matrix.rank }}-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: rank-${{ matrix.rank }}-evidence
          path: |
            experiments/ablation-r${{ matrix.rank }}-validation.json
            artifacts/runs/ablation-r${{ matrix.rank }}/run_metadata.json

  select-rank:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiment]')
    needs: lora-ablation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rank-*-evidence
          merge-multiple: true
          path: evidence
      - name: Select rank using validation macro F1
        env: { PYTHONPATH: src }
        run: |
          mkdir -p experiments
          python scripts/select_rank.py             --reports             evidence/experiments/ablation-r4-validation.json             evidence/experiments/ablation-r8-validation.json             evidence/experiments/ablation-r16-validation.json             --output experiments/selected-rank.json
      - uses: actions/upload-artifact@v4
        with:
          name: selected-rank
          path: experiments/selected-rank.json

  final:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiment]')
    needs: [prepare, frozen, select-rank]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m pip install --upgrade             "transformers>=5,<6" "peft>=0.20,<1" "protobuf>=5,<7"             "datasets>=4,<5" "accelerate>=1.8,<2" "pyyaml>=6,<7"             "sentencepiece>=0.2,<1" "scikit-learn>=1.7,<2"
      - uses: actions/download-artifact@v4
        with: { name: benchmark-inputs }
      - uses: actions/download-artifact@v4
        with: { name: frozen-evidence, path: frozen-evidence }
      - uses: actions/download-artifact@v4
        with: { name: selected-rank, path: selected-rank }
      - name: Resolve selected rank
        id: rank
        shell: bash
        run: echo "rank=$(python -c 'import json; print(json.load(open("selected-rank/experiments/selected-rank.json"))["selected"]["rank"])')" >> "$GITHUB_OUTPUT"
      - run: cp frozen-evidence/experiments/frozen-evaluation.json experiments/frozen-evaluation.json
      - run: cp selected-rank/experiments/selected-rank.json experiments/selected-rank.json
      - name: Train final LoRA
        env: { PYTHONPATH: src }
        run: |
          rank=$(python -c 'import json; print(json.load(open("experiments/selected-rank.json"))["selected"]["rank"])')
          python scripts/train_lora.py             --config configs/ci-final.yaml             --experiment-name "selected-r${rank}-final"             --rank "$rank"
      - name: Evaluate final model on full test
        env: { PYTHONPATH: src }
        run: |
          python scripts/evaluate_model.py             --model-dir artifacts/runs/selected-r${{ steps.rank.outputs.rank }}-final             --adapter             --data data/processed/banking77/test.jsonl             --output experiments/selected-r${{ steps.rank.outputs.rank }}-final-evaluation.json
      - name: Analyze errors
        env: { PYTHONPATH: src }
        run: |
          python scripts/analyze_errors.py             experiments/selected-r${{ steps.rank.outputs.rank }}-final-evaluation.json             --output experiments/selected-r${{ steps.rank.outputs.rank }}-final-error-analysis.json
      - name: Compare predictions
        env: { PYTHONPATH: src }
        run: |
          python scripts/compare_predictions.py             experiments/frozen-evaluation.json             experiments/selected-r${{ steps.rank.outputs.rank }}-final-evaluation.json             --output experiments/frozen-vs-final-changes.json
      - name: Compile results
        env: { PYTHONPATH: src }
        run: python scripts/compile_results.py
      - name: Write benchmark report
        env: { PYTHONPATH: src }
        run: |
          python scripts/write_benchmark_report.py             --summary experiments/summary.json             --selection experiments/selected-rank.json             --errors experiments/selected-r${{ steps.rank.outputs.rank }}-final-error-analysis.json             --output docs/BENCHMARK-REPORT.md             --run-id "$GITHUB_RUN_ID"
      - name: Verify benchmark integrity
        env: { PYTHONPATH: src }
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          selection = json.loads(Path("experiments/selected-rank.json").read_text())
          selected_rank = int(selection["selected"]["rank"])
          run_dir = Path("artifacts/runs") / f"selected-r{selected_rank}-final"
          metadata = json.loads((run_dir / "run_metadata.json").read_text())
          evaluation = json.loads(Path(f"experiments/selected-r{selected_rank}-final-evaluation.json").read_text())
          summary = json.loads(Path("experiments/summary.json").read_text())

          configured_rank = int(metadata["config"]["lora"]["r"])
          if configured_rank != selected_rank:
              raise SystemExit(f"final rank mismatch: selected={selected_rank}, configured={configured_rank}")

          predictions = evaluation["predictions"]
          distinct = {row["predicted"] for row in predictions}
          if len(predictions) < 1000:
              raise SystemExit(f"final evaluation is unexpectedly small: {len(predictions)}")
          if len(distinct) < 5:
              raise SystemExit(f"final classifier appears collapsed: {len(distinct)} distinct predictions")

          for metric in ("accuracy", "macro_f1", "weighted_f1"):
              value = float(evaluation["report"]["metrics"][metric])
              if not 0.0 <= value <= 1.0:
                  raise SystemExit(f"invalid {metric}: {value}")

          names = {row["experiment"] for row in summary["experiments"]}
          required = {"B0 Majority", "B1 TF-IDF + LR", "B2 Frozen DeBERTa"}
          if not required.issubset(names):
              raise SystemExit("compiled summary is missing required baseline rows")

          required_files = [
              "adapter_model.safetensors",
              "adapter_config.json",
              "tokenizer_config.json",
              "run_metadata.json",
          ]
          missing = [name for name in required_files if not (run_dir / name).exists()]
          if missing:
              raise SystemExit("final adapter evidence missing: " + ", ".join(missing))

          tokenizer_candidates = ("tokenizer.json", "spm.model")
          if not any((run_dir / name).exists() for name in tokenizer_candidates):
              raise SystemExit(
                  "final tokenizer evidence missing: expected tokenizer.json or spm.model"
              )

          print(json.dumps({
              "status": "verified",
              "selected_rank": selected_rank,
              "final_examples": len(predictions),
              "distinct_predictions": len(distinct),
              "metrics": evaluation["report"]["metrics"],
          }, indent=2))
          PY

      - name: Inference smoke
        env: { PYTHONPATH: src }
        run: |
          python -m pretrained_llm_adaptation.cli predict             --model-dir artifacts/runs/selected-r${{ steps.rank.outputs.rank }}-final             --text "How long will my card take to arrive?"
      - uses: actions/upload-artifact@v4
        with:
          name: final-benchmark-evidence
          path: |
            experiments/
            docs/BENCHMARK-REPORT.md
            artifacts/runs/selected-r*-final/adapter_model.safetensors
            artifacts/runs/selected-r*-final/adapter_config.json
            artifacts/runs/selected-r*-final/tokenizer.json
            artifacts/runs/selected-r*-final/spm.model
            artifacts/runs/selected-r*-final/tokenizer_config.json
            artifacts/runs/selected-r*-final/run_metadata.json

  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiment]')
    needs: final
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: final-benchmark-evidence, path: published }
      - name: Publish verified evidence
        run: |
          cp -r published/experiments/. experiments/
          cp published/docs/BENCHMARK-REPORT.md docs/BENCHMARK-REPORT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments docs/BENCHMARK-REPORT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: publish verified benchmark evidence"
          git push origin HEAD:main
