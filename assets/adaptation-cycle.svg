<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Pretrained LLM Adaptation workflow</title>
  <desc id="desc">A practical engineering cycle from problem definition and data engineering through baselines, pretrained model adaptation, evaluation, error analysis, inference, reproducibility, and iteration.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#171c2f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7f9"/>
      <stop offset="50%" stop-color="#8b8cf7"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>


  <path d="M 600,116
           C 820,116 982,232 982,340
           C 982,448 820,564 600,564
           C 380,564 218,448 218,340
           C 218,232 380,116 600,116 Z"
        fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 12"/>

  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" opacity="0.8">
    <path d="M 655 126 C 745 140 810 168 835 194"/>
    <path d="M 900 250 C 930 275 945 303 947 320"/>
    <path d="M 928 390 C 910 430 887 452 858 465"/>
    <path d="M 800 520 C 735 545 678 555 656 558"/>
    <path d="M 545 558 C 470 548 410 525 370 500"/>
    <path d="M 285 453 C 255 420 244 383 244 360"/>
    <path d="M 272 320 C 282 275 315 235 345 218"/>
    <path d="M 400 160 C 445 135 505 122 544 120"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(600 116)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="45" fill="none" stroke="#6ee7f9" stroke-width="2" opacity="0.28"/>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Problem</text>
      <text y="17" fill="#94a3b8" font-size="12">Task definition</text>
    </g>

    <g transform="translate(855 198)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="45" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.28"/>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Data</text>
      <text y="17" fill="#94a3b8" font-size="12">Validate &amp; split</text>
    </g>

    <g transform="translate(960 340)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="45" fill="none" stroke="#8b8cf7" stroke-width="2" opacity="0.28"/>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Baselines</text>
      <text y="17" fill="#94a3b8" font-size="12">Classical + frozen</text>
    </g>

    <g transform="translate(855 482)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="45" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.28"/>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Adapt</text>
      <text y="17" fill="#94a3b8" font-size="12">DeBERTa + LoRA</text>
    </g>

    <g transform="translate(600 564)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="45" fill="none" stroke="#6ee7f9" stroke-width="2" opacity="0.28"/>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Evaluate</text>
      <text y="17" fill="#94a3b8" font-size="12">Metrics + ablation</text>
    </g>

    <g transform="translate(345 482)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="45" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.28"/>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Understand</text>
      <text y="17" fill="#94a3b8" font-size="12">Errors &amp; changes</text>
    </g>

    <g transform="translate(240 340)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="45" fill="none" stroke="#8b8cf7" stroke-width="2" opacity="0.28"/>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Reproduce</text>
      <text y="17" fill="#94a3b8" font-size="12">CLI + evidence</text>
    </g>

    <g transform="translate(345 198)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="45" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.28"/>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Iterate</text>
      <text y="17" fill="#94a3b8" font-size="12">Evidence drives change</text>
    </g>
  </g>

  <g transform="translate(600 340)" text-anchor="middle">
    <circle r="112" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle r="94" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="5 10" opacity="0.8"/>
    <text y="-10" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">
      Pretrained LLM
    </text>
    <text y="18" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
      Adaptation
    </text>
    <text y="43" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">
      build → measure → learn
    </text>
  </g>

</svg>
