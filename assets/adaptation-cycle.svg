<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Pretrained LLM Adaptation workflow</title>
  <desc id="desc">An animated engineering cycle from problem definition and data engineering through baselines, pretrained model, LoRA adaptation, evaluation, error analysis, and inference, looping back into measurement.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#171c2f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7f9"/>
      <stop offset="50%" stop-color="#8b8cf7"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.22"/>
    </filter>
    <path id="flowPath"
      d="M 600,116
         C 820,116 982,232 982,340
         C 982,448 820,564 600,564
         C 380,564 218,448 218,340
         C 218,232 380,116 600,116
         Z"/>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>

  <text x="70" y="72" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">
    How I approach pretrained-model adaptation
  </text>
  <text x="70" y="105" fill="#a7b0c0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">
    Define → validate → compare → adapt → measure → understand → reproduce
  </text>

  <path d="M 600,116 C 820,116 982,232 982,340 C 982,448 820,564 600,564 C 380,564 218,448 218,340 C 218,232 380,116 600,116 Z"
        fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 12"/>

  <path d="M 600,116 C 820,116 982,232 982,340 C 982,448 820,564 600,564 C 380,564 218,448 218,340 C 218,232 380,116 600,116 Z"
        fill="none" stroke="url(#ring)" stroke-opacity="0.34" stroke-width="2"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle" filter="url(#soft)">
    <g transform="translate(600 116)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="56" fill="none" stroke="#6ee7f9" stroke-width="2" opacity="0.35">
        <animate attributeName="r" values="56;62;56" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0.05;0.35" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Problem</text>
      <text y="17" fill="#94a3b8" font-size="12">Task definition</text>
    </g>

    <g transform="translate(855 198)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="56" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.3">
        <animate attributeName="r" values="56;62;56" dur="3.2s" begin="0.45s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.2s" begin="0.45s" repeatCount="indefinite"/>
      </circle>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Data</text>
      <text y="17" fill="#94a3b8" font-size="12">Validate & split</text>
    </g>

    <g transform="translate(960 340)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="56" fill="none" stroke="#8b8cf7" stroke-width="2" opacity="0.3">
        <animate attributeName="r" values="56;62;56" dur="3.2s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.2s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Baselines</text>
      <text y="17" fill="#94a3b8" font-size="12">Classical + frozen</text>
    </g>

    <g transform="translate(855 482)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="56" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.3">
        <animate attributeName="r" values="56;62;56" dur="3.2s" begin="1.35s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.2s" begin="1.35s" repeatCount="indefinite"/>
      </circle>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Adapt</text>
      <text y="17" fill="#94a3b8" font-size="12">DeBERTa + LoRA</text>
    </g>

    <g transform="translate(600 564)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="56" fill="none" stroke="#6ee7f9" stroke-width="2" opacity="0.3">
        <animate attributeName="r" values="56;62;56" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Evaluate</text>
      <text y="17" fill="#94a3b8" font-size="12">Metrics + ablation</text>
    </g>

    <g transform="translate(345 482)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="56" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.3">
        <animate attributeName="r" values="56;62;56" dur="3.2s" begin="2.25s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.2s" begin="2.25s" repeatCount="indefinite"/>
      </circle>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Understand</text>
      <text y="17" fill="#94a3b8" font-size="12">Errors & changes</text>
    </g>

    <g transform="translate(240 340)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="56" fill="none" stroke="#8b8cf7" stroke-width="2" opacity="0.3">
        <animate attributeName="r" values="56;62;56" dur="3.2s" begin="2.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.2s" begin="2.7s" repeatCount="indefinite"/>
      </circle>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Reproduce</text>
      <text y="17" fill="#94a3b8" font-size="12">CLI + evidence</text>
    </g>

    <g transform="translate(345 198)">
      <circle r="56" fill="#111827" stroke="#64748b" stroke-width="2"/>
      <circle r="56" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.3">
        <animate attributeName="r" values="56;62;56" dur="3.2s" begin="3.15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.2s" begin="3.15s" repeatCount="indefinite"/>
      </circle>
      <text y="-5" fill="#f8fafc" font-size="15" font-weight="700">Iterate</text>
      <text y="17" fill="#94a3b8" font-size="12">Evidence drives change</text>
    </g>
  </g>

  <g>
    <circle r="8" fill="#f8fafc" filter="url(#glow)">
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#flowPath"/>
      </animateMotion>
    </circle>
    <circle r="3.2" fill="#6ee7f9">
      <animateMotion dur="8s" repeatCount="indefinite" begin="4s" rotate="auto">
        <mpath href="#flowPath"/>
      </animateMotion>
    </circle>
  </g>

  <g transform="translate(600 340)" text-anchor="middle">
    <circle r="112" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle r="94" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="5 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </circle>
    <text y="-10" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">
      Pretrained LLM
    </text>
    <text y="18" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
      Adaptation
    </text>
    <text y="43" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">
      build → measure → learn
    </text>
  </g>

  <text x="70" y="632" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">
    Animated with SVG/SMIL only — no JavaScript required.
  </text>
</svg>
