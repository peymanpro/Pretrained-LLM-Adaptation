experiment_name: smoke
task: banking77-intent-classification
dataset:
  name: PolyAI/banking77
  source_revision: 57ec275d8078af65b7731c2a98be812d844a6d6b
  raw_dir: tests/fixtures
  processed_dir: tests/fixtures/processed
  validation_fraction: 0.25
  seed: 42
model:
  name: hf-internal-testing/tiny-random-distilbert
  revision: main
  max_length: 32
lora:
  enabled: true
  r: 4
  alpha: 8
  dropout: 0.0
  target_modules: [q_lin, v_lin]
  modules_to_save: [classifier]
training:
  learning_rate: 0.0001
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  weight_decay: 0.0
  warmup_ratio: 0.0
  eval_strategy: epoch
  save_strategy: epoch
  logging_steps: 1
  seed: 42
  fp16: false
  bf16: false
  output_dir: artifacts/runs
  load_best_model_at_end: true
