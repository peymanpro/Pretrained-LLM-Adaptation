[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pretrained-llm-adaptation"
version = "0.1.0"
description = "A reproducible study of adapting a pretrained language model to a concrete downstream NLP task."
readme = "docs/PROJECT-SCOPE.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Peyman Salimi" }]
dependencies = [
  "accelerate>=1.8",
  "datasets>=4.0",
  "pandas>=2.2",
  "peft>=0.20",
  "pyyaml>=6.0",
  "safetensors>=0.5",
  "scikit-learn>=1.7",
  "torch>=2.7",
  "transformers>=5.0",
]

[project.scripts]
llm-adapt = "pretrained_llm_adaptation.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=9.0",
  "pytest-cov>=6.1",
  "ruff>=0.13",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.coverage.run]
source = ["pretrained_llm_adaptation"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
